<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- stage 1 -->
  <text x="150" y="70" text-anchor="middle" font-size="30" fill="#111" font-weight="bold">Observe</text>
  <text x="150" y="130" text-anchor="middle" font-size="19" fill="#333">time runs forward;</text>
  <text x="150" y="156" text-anchor="middle" font-size="19" fill="#333">things happen</text>

  <line x1="275" y1="110" x2="315" y2="110" stroke="#333" stroke-width="3" marker-end="url(#head)"/>

  <!-- stage 2 -->
  <text x="450" y="70" text-anchor="middle" font-size="30" fill="#111" font-weight="bold">Deduce</text>
  <text x="450" y="130" text-anchor="middle" font-size="19" fill="#333">two primitives:</text>
  <text x="450" y="156" text-anchor="middle" font-size="19" fill="#333">possibility, commitment</text>

  <line x1="575" y1="110" x2="615" y2="110" stroke="#333" stroke-width="3" marker-end="url(#head)"/>

  <!-- stage 3 -->
  <text x="750" y="70" text-anchor="middle" font-size="30" fill="#111" font-weight="bold">Rule</text>
  <text x="750" y="130" text-anchor="middle" font-size="19" fill="#333">rules only where the primitives</text>
  <text x="750" y="156" text-anchor="middle" font-size="19" fill="#333">are silent or contradicted</text>

  <line x1="885" y1="110" x2="925" y2="110" stroke="#333" stroke-width="3" marker-end="url(#head)"/>

  <!-- stage 4 -->
  <text x="1050" y="70" text-anchor="middle" font-size="30" fill="#111" font-weight="bold">Recover</text>
  <text x="1050" y="130" text-anchor="middle" font-size="19" fill="#333">physics up to 1930;</text>
  <text x="1050" y="156" text-anchor="middle" font-size="19" fill="#333">stops at the nucleus</text>

  <!-- footer -->
  <line x1="80" y1="215" x2="1120" y2="215" stroke="#bbb" stroke-width="1"/>
  <text x="600" y="255" text-anchor="middle" font-size="18" fill="#555" font-style="italic">Nothing is deleted; a ruling that fails is struck through and kept. Grades: candidate → needed → ruled.</text>
</svg>
